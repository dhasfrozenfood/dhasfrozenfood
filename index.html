<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir</title>
<style>
  :root {
    --ink: #1c1c1c;
    --paper: #fafaf8;
    --line: #e2e2df;
    --accent: #2f6f4f;
    --accent-dim: #eaf3ee;
    --danger: #b3413c;
    --muted: #77756f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 10px;
    align-items: center;
    position: sticky;
    top: 0;
    background: var(--paper);
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  #search {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 14px;
  }
  #search:focus { outline: 2px solid var(--accent); border-color: var(--accent); }

  main {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 0;
    min-height: calc(100vh - 60px);
  }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    #cart-panel { border-left: none; border-top: 1px solid var(--line); }
  }

  #product-list {
    padding: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
    align-content: start;
  }
  .card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    background: white;
    cursor: pointer;
    transition: border-color .15s, transform .1s;
  }
  .card:hover { border-color: var(--accent); }
  .card:active { transform: scale(0.98); }
  .card .nama {
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 6px;
    min-height: 34px;
  }
  .card .harga {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
  }
  .card .stok {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 4px;
  }
  .card .stok.habis { color: var(--danger); font-weight: 600; }
  .card.disabled { opacity: 0.45; cursor: not-allowed; }

  #cart-panel {
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    background: white;
  }
  #cart-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    font-weight: 700;
    font-size: 15px;
  }
  #cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .cart-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border-bottom: 1px solid var(--line);
  }
  .cart-row .info { flex: 1; min-width: 0; }
  .cart-row .nama {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cart-row .sub { font-size: 12px; color: var(--muted); }
  .qty-ctrl {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .qty-ctrl button {
    width: 24px; height: 24px;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }
  .qty-ctrl span { font-size: 13px; min-width: 18px; text-align: center; }
  .remove-btn {
    background: none; border: none; color: var(--danger);
    cursor: pointer; font-size: 16px; padding: 4px;
  }
  #cart-empty {
    padding: 30px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
  }
  #cart-footer {
    padding: 14px 16px;
    border-top: 1px solid var(--line);
  }
  #total-row {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  #checkout-btn {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  #checkout-btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
  #checkout-btn:active:not(:disabled) { transform: scale(0.98); }

  #status-msg {
    padding: 10px 16px;
    font-size: 13px;
    text-align: center;
    color: var(--muted);
  }
  #status-msg.error { color: var(--danger); }
  #status-msg.success { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1>Kasir</h1>
  <input id="search" type="text" placeholder="Cari nama barang atau scan barcode..." autocomplete="off">
</header>

<main>
  <div id="product-list">
    <div id="status-msg">Memuat data barang...</div>
  </div>

  <div id="cart-panel">
    <div id="cart-header">Keranjang</div>
    <div id="cart-items">
      <div id="cart-empty">Belum ada barang dipilih</div>
    </div>
    <div id="cart-footer">
      <div id="total-row">
        <span>Total</span>
        <span id="total-amount">Rp 0</span>
      </div>
      <button id="checkout-btn" disabled>Bayar</button>
    </div>
  </div>
</main>

<script>
// ==================== KONFIGURASI ====================
const API_URL = "https://script.google.com/macros/s/AKfycbx0tRinoViFQ9sMQF1ARVcl8S-9jACrA6cO0hfNgc2qJ8PgrNXqXk4je5Dpj0d7wgo/exec";

let allBarang = [];
let cart = {}; // { row: { ...barang, qty } }

// ==================== FORMAT ====================
function rupiah(n) {
  return "Rp " + Number(n).toLocaleString("id-ID");
}

// ==================== AMBIL DATA BARANG ====================
async function loadBarang() {
  const listEl = document.getElementById("product-list");
  try {
    const res = await fetch(API_URL + "?action=getBarang");
    const json = await res.json();
    if (!json.success) throw new Error(json.error || "Gagal memuat data");
    allBarang = json.data;
    renderList(allBarang);
  } catch (err) {
    listEl.innerHTML = '<div id="status-msg" class="error">Gagal memuat barang: ' + err.message + '</div>';
  }
}

// ==================== RENDER DAFTAR BARANG ====================
function renderList(items) {
  const listEl = document.getElementById("product-list");
  if (items.length === 0) {
    listEl.innerHTML = '<div id="status-msg">Barang tidak ditemukan</div>';
    return;
  }
  listEl.innerHTML = items.map(b => {
    const habis = b.stok <= 0;
    return `
      <div class="card ${habis ? 'disabled' : ''}" data-row="${b.row}" onclick="${habis ? '' : 'addToCart(' + b.row + ')'}">
        <div class="nama">${escapeHtml(b.nama)}</div>
        <div class="harga">${rupiah(b.harga_jual)}</div>
        <div class="stok ${habis ? 'habis' : ''}">${habis ? 'Stok habis' : 'Stok: ' + b.stok}</div>
      </div>
    `;
  }).join("");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

// ==================== PENCARIAN ====================
document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { renderList(allBarang); return; }
  const filtered = allBarang.filter(b =>
    (b.nama || "").toLowerCase().includes(q) ||
    (b.barcode || "").toString().includes(q)
  );
  renderList(filtered);
});

// ==================== KERANJANG ====================
function addToCart(row) {
  const barang = allBarang.find(b => b.row === row);
  if (!barang) return;

  const qtyDiKeranjang = cart[row] ? cart[row].qty : 0;
  if (qtyDiKeranjang + 1 > barang.stok) {
    showStatus("Stok tidak cukup untuk " + barang.nama, "error");
    return;
  }

  if (cart[row]) {
    cart[row].qty += 1;
  } else {
    cart[row] = { ...barang, qty: 1 };
  }
  renderCart();
}

function changeQty(row, delta) {
  const item = cart[row];
  if (!item) return;
  const newQty = item.qty + delta;

  if (newQty <= 0) {
    delete cart[row];
  } else if (newQty > item.stok) {
    showStatus("Stok tidak cukup untuk " + item.nama, "error");
    return;
  } else {
    item.qty = newQty;
  }
  renderCart();
}

function removeFromCart(row) {
  delete cart[row];
  renderCart();
}

function renderCart() {
  const itemsEl = document.getElementById("cart-items");
  const rows = Object.values(cart);

  if (rows.length === 0) {
    itemsEl.innerHTML = '<div id="cart-empty">Belum ada barang dipilih</div>';
    document.getElementById("checkout-btn").disabled = true;
  } else {
    itemsEl.innerHTML = rows.map(item => `
      <div class="cart-row">
        <div class="info">
          <div class="nama">${escapeHtml(item.nama)}</div>
          <div class="sub">${rupiah(item.harga_jual)} × ${item.qty}</div>
        </div>
        <div class="qty-ctrl">
          <button onclick="changeQty(${item.row}, -1)">−</button>
          <span>${item.qty}</span>
          <button onclick="changeQty(${item.row}, 1)">+</button>
        </div>
        <button class="remove-btn" onclick="removeFromCart(${item.row})">×</button>
      </div>
    `).join("");
    document.getElementById("checkout-btn").disabled = false;
  }

  const total = rows.reduce((sum, item) => sum + (item.harga_jual * item.qty), 0);
  document.getElementById("total-amount").textContent = rupiah(total);
}

// ==================== CHECKOUT ====================
document.getElementById("checkout-btn").addEventListener("click", async () => {
  const rows = Object.values(cart);
  if (rows.length === 0) return;

  const btn = document.getElementById("checkout-btn");
  btn.disabled = true;
  btn.textContent = "Memproses...";

  const items = rows.map(item => ({ row: item.row, qty: item.qty }));

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "checkout", items })
    });
    const json = await res.json();

    if (!json.success) throw new Error(json.error || "Checkout gagal");

    const gagal = json.results.filter(r => !r.success);
    if (gagal.length > 0) {
      showStatus("Sebagian gagal: stok berubah, silakan cek ulang keranjang.", "error");
      await loadBarang();
    } else {
      showStatus("Transaksi berhasil!", "success");
      cart = {};
      renderCart();
      await loadBarang();
    }
  } catch (err) {
    showStatus("Gagal checkout: " + err.message, "error");
  } finally {
    btn.textContent = "Bayar";
    btn.disabled = Object.keys(cart).length === 0;
  }
});

function showStatus(msg, type) {
  let el = document.getElementById("floating-status");
  if (!el) {
    el = document.createElement("div");
    el.id = "floating-status";
    el.style.cssText = "position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:6px;font-size:13.5px;font-weight:600;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15);";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.background = type === "error" ? "#b3413c" : "#2f6f4f";
  el.style.color = "white";
  el.style.display = "block";
  clearTimeout(window._statusTimeout);
  window._statusTimeout = setTimeout(() => { el.style.display = "none"; }, 3000);
}

// ==================== INIT ====================
loadBarang();
</script>

</body>
</html>
