<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frozen Food Dhas - Kasir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171c;
    --panel: #1b1f26;
    --panel-2: #22262e;
    --line: #2c3138;
    --ink: #eef1f5;
    --muted: #8b93a1;
    --accent: #ff8a3d;
    --accent-ink: #1a1206;
    --good: #33c98f;
    --bad: #ff5c5c;
    --card: #1e222a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  h1, h2, h3, .display { font-family: 'Manrope', sans-serif; }

  /* ===== SIDEBAR ===== */
  #sidebar {
    width: 84px;
    background: #0f1216;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 0;
    flex-shrink: 0;
  }
  #sidebar {
    height: 100%;
  }
  #sidebar .logo {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #ff5c3d);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 11px; color: var(--accent-ink);
    margin-bottom: 26px;
    font-family: 'Manrope', sans-serif;
    letter-spacing: 0.02em;
  }
  .cat-btn {
    width: 60px;
    padding: 10px 4px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    border-radius: 10px;
    margin-bottom: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: background .15s, color .15s;
  }
  .cat-btn .ic {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .cat-btn:hover { color: var(--ink); }
  .cat-btn.active { color: var(--accent); }
  .cat-btn.active .ic { background: var(--accent); color: var(--accent-ink); }

  /* ===== MAIN AREA ===== */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #topbar {
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #topbar h1 { font-size: 19px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .search-wrap {
    flex: 1;
    position: relative;
    max-width: 460px;
  }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: .5; }
  #search {
    width: 100%;
    padding: 10px 14px 10px 36px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    font-size: 13.5px;
    font-family: inherit;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { outline: none; border-color: var(--accent); }
  .scan-hint {
    font-size: 11.5px;
    color: var(--muted);
    background: var(--panel-2);
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    white-space: nowrap;
  }

  #product-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 18px 22px;
  }
  #product-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
    cursor: pointer;
    transition: border-color .12s, transform .08s;
    display: flex;
    flex-direction: column;
    min-height: 108px;
  }
  .card:hover { border-color: var(--accent); }
  .card:active { transform: scale(0.97); }
  .card .swatch {
    width: 100%; height: 34px;
    border-radius: 8px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, var(--panel-2), #2a2f38);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; color: var(--muted);
    font-family: 'Manrope', sans-serif;
  }
  .card .nama {
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: auto;
    padding-bottom: 8px;
    color: var(--ink);
  }
  .card .harga {
    font-size: 14.5px;
    font-weight: 800;
    color: var(--accent);
    font-family: 'Manrope', sans-serif;
  }
  .card .stok-tag {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 3px;
  }
  .card.disabled { opacity: 0.35; cursor: not-allowed; }
  .card.disabled:hover { border-color: var(--line); }

  #empty-state, #loading-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 13.5px;
  }

  /* ===== CART PANEL ===== */
  #cart-panel {
    width: 380px;
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  #cart-head {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
  }
  #cart-head h2 { font-size: 15px; font-weight: 800; margin: 0 0 2px; }
  #cart-head .sub { font-size: 11.5px; color: var(--muted); }

  #cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
  }
  .cart-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 6px;
    border-bottom: 1px solid var(--line);
  }
  .cart-row .num {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--panel-2);
    font-size: 10.5px;
    font-weight: 700;
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .cart-row .info { flex: 1; min-width: 0; }
  .cart-row .nama {
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cart-row .sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .qty-ctrl {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--panel-2);
    border-radius: 8px;
    padding: 3px;
  }
  .qty-ctrl button {
    width: 20px; height: 20px;
    border: none;
    background: none;
    color: var(--ink);
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  .qty-ctrl button:hover { background: var(--line); }
  .qty-ctrl span { font-size: 12px; min-width: 16px; text-align: center; font-weight: 700; }
  .remove-btn {
    background: none; border: none; color: var(--bad);
    cursor: pointer; font-size: 15px; padding: 4px; flex-shrink: 0;
  }
  #cart-empty {
    padding: 50px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
  }
  #cart-empty .ic { font-size: 30px; margin-bottom: 10px; opacity: .5; }

  #cart-foot {
    padding: 16px 20px 20px;
    border-top: 1px solid var(--line);
  }
  .sum-line {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .sum-line.total {
    color: var(--ink);
    font-size: 19px;
    font-weight: 800;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    font-family: 'Manrope', sans-serif;
  }
  #diskon-input, #bayar-input {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 5px 8px;
    border-radius: 6px;
    width: 110px;
    text-align: right;
    font-size: 13px;
    font-family: inherit;
  }
  #kembali-line { color: var(--good); font-weight: 700; }

  #checkout-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 14px;
    font-family: 'Manrope', sans-serif;
  }
  #checkout-btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
  #checkout-btn:active:not(:disabled) { transform: scale(0.98); }

  #status-toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 11px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: none;
  }
  #status-toast.error { background: var(--bad); color: white; }
  #status-toast.success { background: var(--good); color: #073023; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 900px) {
    #sidebar { display: none; }
    #cart-panel { width: 320px; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <div class="logo">FFD</div>
  <button class="cat-btn active" data-cat="semua">
    <div class="ic">▤</div>
    Semua
  </button>
  <button class="cat-btn" data-cat="habis">
    <div class="ic">!</div>
    Habis
  </button>
  <div style="flex:1"></div>
  <button class="cat-btn" id="riwayat-btn">
    <div class="ic">🧾</div>
    Riwayat
  </button>
</div>

<div id="main">
  <div id="topbar">
    <div>
      <h1>Frozen Food Dhas</h1>
      <div style="font-size:11px; color:var(--muted); margin-top:1px;">Kasir Toko</div>
    </div>
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="text" placeholder="Cari nama barang..." autocomplete="off">
    </div>
    <div class="scan-hint">🔫 Scan barcode kapan saja — otomatis masuk keranjang</div>
  </div>

  <div id="product-scroll">
    <div id="product-list">
      <div id="loading-state">Memuat data barang...</div>
    </div>
  </div>
</div>

<div id="cart-panel">
  <div id="cart-head">
    <h2>Keranjang</h2>
    <div class="sub" id="cart-count">0 item</div>
  </div>
  <div id="cart-items">
    <div id="cart-empty">
      <div class="ic">🛒</div>
      Belum ada barang dipilih<br>Scan atau klik produk untuk mulai
    </div>
  </div>
  <div id="cart-foot">
    <div class="sum-line">
      <span>Subtotal</span>
      <span id="subtotal-val">Rp 0</span>
    </div>
    <div class="sum-line">
      <span>Diskon</span>
      <input id="diskon-input" type="number" value="0" min="0">
    </div>
    <div class="sum-line">
      <span>Bayar</span>
      <input id="bayar-input" type="number" value="0" min="0">
    </div>
    <div class="sum-line" id="kembali-line">
      <span>Kembali</span>
      <span id="kembali-val">Rp 0</span>
    </div>
    <div class="sum-line total">
      <span>Total</span>
      <span id="total-val">Rp 0</span>
    </div>
    <button id="checkout-btn" disabled>Proses Bayar</button>
  </div>
</div>

<div id="status-toast"></div>

<!-- Input tersembunyi untuk menangkap scan barcode dari mana saja -->
<input id="barcode-catcher" type="text" style="position:fixed; opacity:0; pointer-events:none; top:-100px;" autocomplete="off">

<!-- ===== MODAL STRUK ===== -->
<div id="receipt-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:200; align-items:center; justify-content:center;">
  <div style="background:#fff; color:#1c1c1c; width:340px; max-height:88vh; overflow-y:auto; border-radius:14px; padding:0;">
    <div id="receipt-content" style="padding:26px 22px; font-family:'Courier New', monospace; font-size:12.5px; line-height:1.6;"></div>
    <div style="padding:16px 22px; border-top:1px dashed #ccc; display:flex; gap:8px;">
      <button onclick="window.print()" style="flex:1; padding:11px; background:#ff8a3d; border:none; border-radius:8px; font-weight:800; cursor:pointer;">Print</button>
      <button onclick="closeReceipt()" style="flex:1; padding:11px; background:#eee; border:none; border-radius:8px; font-weight:700; cursor:pointer;">Tutup</button>
    </div>
  </div>
</div>

<!-- ===== PANEL RIWAYAT ===== -->
<div id="riwayat-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:200; align-items:center; justify-content:center;">
  <div style="background:var(--panel); width:640px; max-width:92vw; max-height:86vh; border-radius:16px; border:1px solid var(--line); display:flex; flex-direction:column;">
    <div style="padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;">
      <h2 style="margin:0; font-size:16px; font-weight:800;">Riwayat Transaksi</h2>
      <button onclick="closeRiwayat()" style="background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer;">×</button>
    </div>
    <div id="riwayat-list" style="flex:1; overflow-y:auto; padding:10px 16px;">
      <div style="text-align:center; padding:40px; color:var(--muted); font-size:13px;">Memuat riwayat...</div>
    </div>
  </div>
</div>

<script>
// ==================== KONFIGURASI ====================
const API_URL = "https://script.google.com/macros/s/AKfycbwo2gsNPoQFddJzFwOpjUfkafLaMnJQL_mdGgybVxwQkI-g11nApTxyFd2va-s2duk/exec";
const TOKO_NAMA = "Frozen Food Dhas";

let allBarang = [];
let cart = {}; // { row: {...barang, qty} }
let currentFilter = "semua";

function rupiah(n) { return "Rp " + Number(n).toLocaleString("id-ID"); }
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

// ==================== MUAT DATA ====================
async function loadBarang() {
  try {
    const res = await fetch(API_URL + "?action=getBarang");
    const json = await res.json();
    if (!json.success) throw new Error(json.error || "Gagal memuat data");
    allBarang = json.data;
    renderList();
  } catch (err) {
    document.getElementById("product-list").innerHTML =
      '<div id="empty-state">Gagal memuat barang.<br>' + escapeHtml(err.message) + '</div>';
  }
}

// ==================== RENDER GRID PRODUK ====================
function renderList() {
  const listEl = document.getElementById("product-list");
  const q = document.getElementById("search").value.trim().toLowerCase();

  let items = allBarang;
  if (currentFilter === "habis") items = items.filter(b => b.stok <= 0);
  if (q) items = items.filter(b =>
    (b.nama || "").toLowerCase().includes(q) || String(b.barcode || "").includes(q)
  );

  if (items.length === 0) {
    listEl.innerHTML = '<div id="empty-state">Barang tidak ditemukan</div>';
    return;
  }

  listEl.innerHTML = items.slice(0, 200).map(b => {
    const habis = b.stok <= 0;
    const initial = (b.nama || "?").trim().charAt(0).toUpperCase();
    return `
      <div class="card ${habis ? 'disabled' : ''}" ${habis ? '' : `onclick="addToCart(${b.row}, 1)"`}>
        <div class="swatch">${initial}</div>
        <div class="nama">${escapeHtml(b.nama)}</div>
        <div class="harga">${rupiah(b.harga_jual)}</div>
        <div class="stok-tag">${habis ? 'Stok habis' : 'Stok ' + b.stok}</div>
      </div>
    `;
  }).join("");
}

document.getElementById("search").addEventListener("input", renderList);

document.querySelectorAll(".cat-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.cat;
    renderList();
  });
});

// ==================== TANGKAP SCAN BARCODE GLOBAL ====================
// Scanner USB mengetik cepat lalu Enter. Kita tangkap ketikan di manapun
// (selama bukan sedang fokus di kolom lain) dan arahkan ke pencocokan barcode.
let scanBuffer = "";
let scanTimer = null;

document.addEventListener("keydown", (e) => {
  const activeTag = document.activeElement.tagName;
  const isTypingField = activeTag === "INPUT" || activeTag === "TEXTAREA";

  if (isTypingField && document.activeElement.id !== "search") return;

  if (e.key === "Enter") {
    if (scanBuffer.length >= 4) {
      handleScan(scanBuffer);
    }
    scanBuffer = "";
    return;
  }
  if (e.key.length === 1 && /[0-9a-zA-Z]/.test(e.key)) {
    scanBuffer += e.key;
    clearTimeout(scanTimer);
    scanTimer = setTimeout(() => { scanBuffer = ""; }, 300);
  }
});

function handleScan(code) {
  const barang = allBarang.find(b => String(b.barcode) === String(code).trim());
  if (barang) {
    addToCart(barang.row, 1);
  } else {
    showStatus('Barcode "' + code + '" tidak ditemukan', "error");
  }
}

// ==================== KERANJANG ====================
function addToCart(row, qty) {
  const barang = allBarang.find(b => b.row === row);
  if (!barang) return;

  const sudahAda = cart[row] ? cart[row].qty : 0;
  if (sudahAda + qty > barang.stok) {
    showStatus("Stok " + barang.nama + " tidak cukup (sisa " + barang.stok + ")", "error");
    return;
  }

  if (cart[row]) {
    cart[row].qty += qty;
  } else {
    cart[row] = { ...barang, qty };
  }
  renderCart();
}

function changeQty(row, delta) {
  const item = cart[row];
  if (!item) return;
  const newQty = item.qty + delta;
  if (newQty <= 0) { delete cart[row]; }
  else if (newQty > item.stok) {
    showStatus("Stok " + item.nama + " tidak cukup", "error");
    return;
  } else { item.qty = newQty; }
  renderCart();
}

function removeFromCart(row) {
  delete cart[row];
  renderCart();
}

function renderCart() {
  const itemsEl = document.getElementById("cart-items");
  const rows = Object.values(cart);
  document.getElementById("cart-count").textContent = rows.reduce((s, i) => s + i.qty, 0) + " item";

  if (rows.length === 0) {
    itemsEl.innerHTML = `<div id="cart-empty"><div class="ic">🛒</div>Belum ada barang dipilih<br>Scan atau klik produk untuk mulai</div>`;
  } else {
    itemsEl.innerHTML = rows.map((item, idx) => `
      <div class="cart-row">
        <div class="num">${idx + 1}</div>
        <div class="info">
          <div class="nama">${escapeHtml(item.nama)}</div>
          <div class="sub">${rupiah(item.harga_jual)} × ${item.qty}</div>
        </div>
        <div class="qty-ctrl">
          <button onclick="changeQty(${item.row}, -1)">−</button>
          <span>${item.qty}</span>
          <button onclick="changeQty(${item.row}, 1)">+</button>
        </div>
        <button class="remove-btn" onclick="removeFromCart(${item.row})">×</button>
      </div>
    `).join("");
  }
  updateSummary();
}

// ==================== RINGKASAN & CHECKOUT ====================
function updateSummary() {
  const rows = Object.values(cart);
  const subtotal = rows.reduce((s, i) => s + i.harga_jual * i.qty, 0);
  const diskon = Number(document.getElementById("diskon-input").value) || 0;
  const total = Math.max(0, subtotal - diskon);
  const bayar = Number(document.getElementById("bayar-input").value) || 0;
  const kembali = Math.max(0, bayar - total);

  document.getElementById("subtotal-val").textContent = rupiah(subtotal);
  document.getElementById("total-val").textContent = rupiah(total);
  document.getElementById("kembali-val").textContent = rupiah(kembali);
  document.getElementById("checkout-btn").disabled = rows.length === 0;

  return { subtotal, diskon, total, bayar, kembali };
}
document.getElementById("diskon-input").addEventListener("input", updateSummary);
document.getElementById("bayar-input").addEventListener("input", updateSummary);

document.getElementById("checkout-btn").addEventListener("click", async () => {
  const rows = Object.values(cart);
  if (rows.length === 0) return;
  const { subtotal, diskon, total, bayar, kembali } = updateSummary();

  if (bayar < total) { showStatus("Uang bayar kurang dari total", "error"); return; }

  const btn = document.getElementById("checkout-btn");
  btn.disabled = true;
  btn.textContent = "Memproses...";

  const items = rows.map(i => ({ row: i.row, qty: i.qty }));
  const itemsForReceipt = rows.map(i => ({ nama: i.nama, harga_jual: i.harga_jual, qty: i.qty }));

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "checkout", items, subtotal, diskon, total, bayar, kembali, kasir: "Kasir" })
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error || "Checkout gagal");

    const gagal = (json.results || []).filter(r => !r.success);
    if (gagal.length > 0) {
      showStatus("Sebagian stok berubah, cek ulang keranjang", "error");
      await loadBarang();
    } else {
      showReceipt({
        no_struk: json.no_struk,
        tanggal: json.tanggal,
        items: itemsForReceipt,
        subtotal, diskon, total, bayar, kembali
      });
      cart = {};
      document.getElementById("diskon-input").value = 0;
      document.getElementById("bayar-input").value = 0;
      renderCart();
      await loadBarang();
    }
  } catch (err) {
    showStatus("Gagal checkout: " + err.message, "error");
  } finally {
    btn.textContent = "Proses Bayar";
    btn.disabled = Object.keys(cart).length === 0;
  }
});

// ==================== STRUK ====================
function showReceipt(trx) {
  const tglObj = trx.tanggal ? new Date(trx.tanggal) : new Date();
  const tglStr = String(tglObj.getDate()).padStart(2,'0') + "-" + String(tglObj.getMonth()+1).padStart(2,'0') + "-" + tglObj.getFullYear()
    + " " + String(tglObj.getHours()).padStart(2,'0') + ":" + String(tglObj.getMinutes()).padStart(2,'0');

  const itemLines = trx.items.map(it =>
    `${it.nama}\n  ${it.qty} x ${rupiah(it.harga_jual)}`.padEnd(0) +
    `${''}`
  );

  let html = `
    <div style="text-align:center; font-weight:700; font-size:14px;">${TOKO_NAMA.toUpperCase()}</div>
    <div style="text-align:center; font-size:11px; margin-bottom:10px;">Struk Belanja</div>
    <div style="border-top:1px dashed #999; margin:8px 0;"></div>
    <div>No: ${trx.no_struk}</div>
    <div>${tglStr}</div>
    <div style="border-top:1px dashed #999; margin:8px 0;"></div>
  `;

  trx.items.forEach(it => {
    html += `<div style="display:flex; justify-content:space-between;"><span>${escapeHtml(it.nama)}</span></div>`;
    html += `<div style="display:flex; justify-content:space-between; color:#555;"><span>${it.qty} x ${rupiah(it.harga_jual)}</span><span>${rupiah(it.harga_jual * it.qty)}</span></div>`;
  });

  html += `<div style="border-top:1px dashed #999; margin:8px 0;"></div>`;
  html += `<div style="display:flex; justify-content:space-between;"><span>Subtotal</span><span>${rupiah(trx.subtotal)}</span></div>`;
  html += `<div style="display:flex; justify-content:space-between;"><span>Diskon</span><span>${rupiah(trx.diskon)}</span></div>`;
  html += `<div style="display:flex; justify-content:space-between; font-weight:700;"><span>Total</span><span>${rupiah(trx.total)}</span></div>`;
  html += `<div style="display:flex; justify-content:space-between;"><span>Bayar</span><span>${rupiah(trx.bayar)}</span></div>`;
  html += `<div style="display:flex; justify-content:space-between;"><span>Kembali</span><span>${rupiah(trx.kembali)}</span></div>`;
  html += `<div style="border-top:1px dashed #999; margin:8px 0;"></div>`;
  html += `<div style="text-align:center; font-size:11px;">Terima kasih telah berbelanja<br>di ${TOKO_NAMA}</div>`;

  document.getElementById("receipt-content").innerHTML = html;
  document.getElementById("receipt-overlay").style.display = "flex";
}
function closeReceipt() {
  document.getElementById("receipt-overlay").style.display = "none";
}

// ==================== RIWAYAT ====================
document.getElementById("riwayat-btn").addEventListener("click", openRiwayat);
function closeRiwayat() {
  document.getElementById("riwayat-overlay").style.display = "none";
}
async function openRiwayat() {
  document.getElementById("riwayat-overlay").style.display = "flex";
  const listEl = document.getElementById("riwayat-list");
  listEl.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted); font-size:13px;">Memuat riwayat...</div>';

  try {
    const res = await fetch(API_URL + "?action=getRiwayat&limit=50");
    const json = await res.json();
    if (!json.success) throw new Error(json.error || "Gagal memuat riwayat");

    if (json.data.length === 0) {
      listEl.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted); font-size:13px;">Belum ada transaksi</div>';
      return;
    }

    listEl.innerHTML = json.data.map(trx => {
      const tglObj = new Date(trx.tanggal);
      const tglStr = String(tglObj.getDate()).padStart(2,'0') + "-" + String(tglObj.getMonth()+1).padStart(2,'0') + "-" + tglObj.getFullYear()
        + " " + String(tglObj.getHours()).padStart(2,'0') + ":" + String(tglObj.getMinutes()).padStart(2,'0');
      return `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 8px; border-bottom:1px solid var(--line);">
          <div>
            <div style="font-size:13px; font-weight:700;">${escapeHtml(trx.no_struk)}</div>
            <div style="font-size:11.5px; color:var(--muted);">${tglStr} · ${escapeHtml(trx.kasir || '')}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:13.5px; font-weight:800; color:var(--accent);">${rupiah(trx.total)}</div>
          </div>
        </div>
      `;
    }).join("");
  } catch (err) {
    listEl.innerHTML = '<div style="text-align:center; padding:40px; color:var(--bad); font-size:13px;">' + escapeHtml(err.message) + '</div>';
  }
}

function showStatus(msg, type) {
  const el = document.getElementById("status-toast");
  el.textContent = msg;
  el.className = type;
  el.style.display = "block";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { el.style.display = "none"; }, 3000);
}

// ==================== INIT ====================
loadBarang();
renderCart();
</script>
